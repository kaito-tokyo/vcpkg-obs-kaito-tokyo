name: Push CI (main)

on:
  push:
    branches: [main]
  schedule:
    - cron: 23 9 * * *
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  vcpkg-manifest-windows:
    uses: ./.github/workflows/vcpkg-manifest-windows.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: windows-2025-vs2026
      vcpkg-version: '2025.08.27'

  vcpkg-ort-windows:
    uses: ./.github/workflows/vcpkg-ort-windows.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: windows-2025-vs2026
      vcpkg-version: '2025.08.27'
      ort-version: v1.28.0

  vcpkg-manifest-macos:
    uses: ./.github/workflows/vcpkg-manifest-macos.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: macos-26
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
      vcpkg-version: '2025.08.27'

  vcpkg-ort-macos:
    uses: ./.github/workflows/vcpkg-ort-macos.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: macos-26
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
      vcpkg-version: '2025.08.27'
      ort-version: v1.28.0

  vcpkg-manifest-macos-x86_64:
    uses: ./.github/workflows/vcpkg-manifest-macos.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: macos-26
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
      vcpkg-version: '2025.08.27'
      x86_64: true


  vcpkg-ort-macos-x86_64:
    uses: ./.github/workflows/vcpkg-ort-macos.yml
    with:
      upload-to-binarycache: true
      environment: production
      runs-on: macos-26
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
      vcpkg-version: '2025.08.27'
      ort-version: v1.28.0
      x86_64: true
