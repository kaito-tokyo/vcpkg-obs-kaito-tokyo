# date: 2026-05-25

on:
  workflow_call:
    inputs:
      environment:
        description: The environment name for this workflow, or empty string for no environment
        required: true
        type: string
      VCPKG_VERSION:
        description: The version of vcpkg to clone.
        required: true
        type: string
      VCPKG_BINARY_SOURCES:
        description: Default VCPKG_BINARY_SOURCES.
        required: true
        type: string

permissions: {}

jobs:
  build-manifest-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    environment: ${{ inputs.environment }}

    permissions:
      attestations: write
      contents: read
      id-token: write

    env:
      MINIMAL_PATH: 'C:\Program Files\Git\cmd;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
      VCPKG_VERSION: '${{ inputs.VCPKG_VERSION }}'

    steps:
      - name: Enable Windows long path
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Set up vcpkg using PowerShell
        shell: pwsh
        run: |
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Print vcpkg toolchains
        shell: pwsh
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          $ErrorActionPreference = 'Stop'; Set-StrictMode -Version Latest; $PSNativeCommandUseErrorActionPreference = $true

          $env:Path = $env:MINIMAL_PATH
          ./vcpkg/vcpkg.exe fetch cmake
          ./vcpkg/vcpkg.exe fetch ninja

      - name: Set up vcpkg binary cache
        id: binarycache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/vcpkg-binarycache/setup

      - name: Install dependencies from vcpkg (x64-windows-static-md-obs)
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: '${{ steps.binarycache.outputs.VCPKG_BINARY_SOURCES || inputs.VCPKG_BINARY_SOURCES }}'
        run: |
          $env:Path = $env:MINIMAL_PATH
          ./vcpkg/vcpkg.exe install --triplet=x64-windows-static-md-obs  --x-install-root=vcpkg_installed_x64-windows-static-md-obs

      - name: Upload binary packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/vcpkg-binarycache/upload
        with:
          artifact-directory: ${{ steps.binarycache.outputs.ARTIFACT_DIRECTORY }}
