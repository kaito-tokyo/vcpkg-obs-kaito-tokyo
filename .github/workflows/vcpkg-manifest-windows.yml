name: Vcpkg Manifest (Windows)

on:
  workflow_call:
    inputs:
      upload-to-binarycache:
        description: Upload to binarycache.
        required: true
        type: boolean
      environment:
        description: GitHub Actions environment name.
        required: false
        type: string
        default: ''
      runs-on:
        description: GitHub Actions runner label.
        required: true
        type: string
      vcpkg-version:
        description: The version of microsoft/vcpkg to clone.
        required: true
        type: string

jobs:
  vcpkg-manifest-windows-x64:
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 180

    env:
      VCPKG_TARGET_TRIPLET: x64-windows-static-md-obs
      VENDORED_VCPKG_ROOT: ${{ github.workspace }}\vendor\vcpkg

    steps:
      - name: Enable Windows long path
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout microsoft/vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ inputs.vcpkg-version }}
          path: vendor/vcpkg
          filter: blob:none
          persist-credentials: false

      - name: Set up MSVC
        id: setup-msvc
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        run: |
          $VS_INSTALLATION_PATH = vswhere -version '[17,18)' -property installationPath
          "VS_INSTALLATION_PATH=$VS_INSTALLATION_PATH"
          Add-Content -Value "VS_INSTALLATION_PATH=$VS_INSTALLATION_PATH" -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Run bootstrap-vcpkg.bat
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          VS_INSTALLATION_PATH: ${{ steps.setup-msvc.outputs.VS_INSTALLATION_PATH }}
        run: |
          $env:Path = 'C:\Program Files\Git\cmd;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          . (Join-Path $env:VS_INSTALLATION_PATH 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64
          Remove-Item env:VCPKG_INSTALLATION_ROOT

          $env:VCPKG_ROOT = $env:VENDORED_VCPKG_ROOT
          & (Join-Path $env:VENDORED_VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics

      - name: Set up vcpkg binary cache
        id: binarycache
        if: inputs.upload-to-binarycache
        uses: ./.github/actions/vcpkg-binarycache/setup
        with:
          binarycache-url: https://vcpkg-obs.kaito.tokyo

      - name: Install vcpkg dependencies (Windows)
        shell: pwsh -Command "Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; . '{0}'"
        env:
          VS_INSTALLATION_PATH: ${{ steps.setup-msvc.outputs.VS_INSTALLATION_PATH }}
          VCPKG_BINARY_SOURCES: ${{ steps.binarycache.outputs.VCPKG_BINARY_SOURCES || 'clear;http,https://vcpkg-obs.kaito.tokyo/{sha},read' }}
        run: |
          $env:Path = 'C:\Program Files\Git\cmd;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
          . (Join-Path $env:VS_INSTALLATION_PATH 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64

          $env:VCPKG_ROOT = $env:VENDORED_VCPKG_ROOT
          & (Join-Path $env:VENDORED_VCPKG_ROOT 'vcpkg.exe') install "--triplet=$env:VCPKG_TARGET_TRIPLET"

      - name: Upload binary packages
        if: ${{ !cancelled() && inputs.upload-to-binarycache }}
        uses: ./.github/actions/vcpkg-binarycache/upload
        with:
          artifact-directory: ${{ steps.binarycache.outputs.ARTIFACT_DIRECTORY }}
