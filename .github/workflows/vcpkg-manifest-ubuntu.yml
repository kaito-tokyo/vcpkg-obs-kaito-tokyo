# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-05-25

on:
  workflow_call:
    inputs:
      environment:
        description: The environment name for this workflow, or empty string for no environment
        required: true
        type: string
      VCPKG_VERSION:
        description: The version of vcpkg to clone.
        required: true
        type: string
      VCPKG_BINARY_SOURCES:
        description: Default VCPKG_BINARY_SOURCES.
        required: true
        type: string

permissions: {}

jobs:
  build-manifest-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: ${{ inputs.environment }}

    permissions:
      attestations: write
      contents: read
      id-token: write

    env:
      MINIMAL_PATH: '/usr/bin:/bin:/usr/sbin:/sbin'
      VCPKG_VERSION: '${{ inputs.VCPKG_VERSION }}'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_VERSION }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Set up vcpkg using Bash
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Print vcpkg toolchains
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
        run: |
          export PATH="$MINIMAL_PATH"
          ./vcpkg/vcpkg fetch cmake
          ./vcpkg/vcpkg fetch ninja

      - name: Set up vcpkg binary cache
        id: binarycache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/vcpkg-binarycache/setup

      - name: Install dependencies from Ubuntu vcpkg (x64-linux-obs)
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        env:
          VCPKG_BINARY_SOURCES: '${{ steps.binarycache.outputs.VCPKG_BINARY_SOURCES || inputs.VCPKG_BINARY_SOURCES }}'
        run: |
          vars=(
            HOME="$HOME"
            PATH="$MINIMAL_PATH"
            VCPKG_BINARY_SOURCES="$VCPKG_BINARY_SOURCES"
            VCPKG_ROOT="$GITHUB_WORKSPACE/vcpkg"
          )
          env -i "${vars[@]}" ./vcpkg/vcpkg install --triplet=x64-linux-obs --x-install-root=vcpkg_installed_x64-linux-obs

      - name: Upload binary packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/vcpkg-binarycache/upload
        with:
          artifact-directory: ${{ steps.binarycache.outputs.ARTIFACT_DIRECTORY }}
