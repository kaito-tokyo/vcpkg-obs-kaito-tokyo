name: Vcpkg ORT macOS

# file: .github/workflows/vcpkg-ort-macos.yml
# author: Kaito Udagawa <umireon@kaito.tokyo>
# date: 2026-06-22

on:
  workflow_call:
    inputs:
      environment:
        description: The environment name for this workflow, or empty string for no environment
        required: true
        type: string
      runs-on:
        description: The runner label to run this workflow on.
        required: true
        type: string
      DEVELOPER_DIR:
        description: The value of DEVELOPER_DIR environment variable.
        required: true
        type: string
      OSX_ARCHITECTURES:
        description: The architecture to build for.
        required: true
        type: string
      OSX_DEPLOYMENT_TARGET:
        description: The deployment target of macOS.
        required: true
        type: string
      VCPKG_VERSION:
        description: The version of vcpkg to clone.
        required: true
        type: string
      ORT_VERSION:
        description: The version of ONNX Runtime to build.
        required: true
        type: string
      VCPKG_BINARY_SOURCES:
        description: Default VCPKG_BINARY_SOURCES.
        required: true
        type: string

    secrets:
      CIPROXY_MASTER_TOKEN:
        description: Master token of the binary cache storage.
        required: false

permissions: {}

jobs:
  vcpkg-ort-macos:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 180
    environment: ${{ inputs.environment }}

    permissions:
      attestations: write
      contents: read
      id-token: write

    env:
      DEVELOPER_DIR: ${{ inputs.DEVELOPER_DIR }}

    steps:
      - name: Print Xcode version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcodebuild -version

      - name: Print xcbeautify version
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          xcbeautify --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python for build requirements
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install build requirements
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          python -m pip install -r requirements-build.txt

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/vcpkg
          ref: ${{ inputs.VCPKG_VERSION }}
          persist-credentials: false
          path: vcpkg
          filter: blob:none

      - name: Run bootstrap-vcpkg.sh
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: |
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Checkout ONNX Runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: microsoft/onnxruntime
          ref: ${{ inputs.ORT_VERSION }}
          persist-credentials: false
          path: onnxruntime
          submodules: recursive

      - name: Set up vcpkg binary cache
        id: binarycache
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/vcpkg-binarycache/setup

      - name: Install dependencies from ONNX Runtime's vcpkg (macOS)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
          VCPKG_BINARY_SOURCES: ${{ steps.binarycache.outputs.VCPKG_BINARY_SOURCES || inputs.VCPKG_BINARY_SOURCES }}
          OSX_ARCHITECTURES: ${{ inputs.OSX_ARCHITECTURES }}
          OSX_DEPLOYMENT_TARGET: ${{ inputs.OSX_DEPLOYMENT_TARGET }}
          ORT_VERSION: ${{ inputs.ORT_VERSION }}
        run: |
          Set-StrictMode -Version Latest; $ErrorActionPreference = 'Stop'; $PSNativeCommandUseErrorActionPreference = $true; $ProgressPreference = 'SilentlyContinue'

          Import-Module ./scripts/BuildOnnxRuntime.psm1

          $vcpkgExe = Join-Path $env:GITHUB_WORKSPACE 'vcpkg' 'vcpkg'

          # Set PATH
          $env:PATH = @(
              Split-Path (Get-Command pwsh).Source -Parent
              '/opt/homebrew/opt/xcbeautify/bin:/usr/bin:/bin:/usr/sbin:/sbin'
          ) -join [System.IO.Path]::PathSeparator

          $env:PATH = @(
              Split-Path (Get-OrtToolchain -Name cmake) -Parent
              Split-Path (Get-OrtToolchain -Name ninja) -Parent
              $env:PATH
          ) -join [System.IO.Path]::PathSeparator

          # Remove vcpkg variables
          $env:VCPKG_ROOT = $null
          $env:VCPKG_INSTALLATION_ROOT = $null

          # Configure GITHUB_TOKEN
          $basicToken = [System.Convert]::ToBase64String(
              [System.Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          )

          Write-Output "::add-mask::$basicToken"

          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraHeader'
          $env:GIT_CONFIG_VALUE_0 = "Authorization: basic $basicToken"

          $assetSourcesScript = Join-Path $env:GITHUB_WORKSPACE 'scripts' 'vcpkg_asset_sources.ps1'
          $env:X_VCPKG_ASSET_SOURCES = "clear;x-script,pwsh -NoProfile -ExecutionPolicy Bypass -File `"$assetSourcesScript`" {url} {sha512} {dst}"

          # Configure ONNX Runtime
          Update-OrtSourceWithPatches -OrtVersion $env:ORT_VERSION
          Invoke-OrtBuildPy -Command update -OsxArchitectures $env:OSX_ARCHITECTURES -OsxDeploymentTarget $env:OSX_DEPLOYMENT_TARGET

      - name: Upload binary packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: ./.github/actions/vcpkg-binarycache/upload
        with:
          artifact-directory: ${{ steps.binarycache.outputs.ARTIFACT_DIRECTORY }}
          master-token: ${{ secrets.CIPROXY_MASTER_TOKEN }}
